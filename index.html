<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Product preview card component</title>

</head>

<body>
  <div class="container">
    <div class="image-container">
      <img src="./images/perfume.png" alt="Product Image" class="product-image">
    </div>
    <div class="content">

      <p class="category">P E R F U M E</p>

      <h1>Coffee Addictive Oriental Frutal</h1>

      <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.</p>
      <div class="price">
        <div class="prices">
          <span class="current-price">$149.99</span>
          <span class="old-price">$169.99</span>
        </div>
        <div class="cart">
         
          <button> <img src="./images/icon-cart.svg" alt="Cart Icon" class="cart-icon">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>
    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
</body>

</html>
